name: x86-64-v3 benchmark

# Compare the speed of our simulations when libOpenCOR and SUNDIALS are built for x86-64 (i.e. SSE2) and for x86-64-v3
# (i.e. AVX2, FMA, etc.; see X86_64_V3_COMPILER_FLAGS in src/CMakeLists.txt).
# Note #1: both versions are built and benchmarked in the same job, so that they are run on the same CPU.
# Note #2: SUNDIALS is built from source for both versions, so that only the compiler flags differ between them.
# Note #3: the x86-64 version is built by emptying X86_64_V3_COMPILER_FLAGS in src/CMakeLists.txt, which is why we build
#          the x86-64-v3 version first (CMake would otherwise reconfigure it).

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Windows (Intel)'
            os: windows-2022
          - name: 'Linux (Intel)'
            os: ubuntu-24.04
          - name: 'macOS (Intel)'
            os: macos-15-intel
    steps:
      - name: Check out libOpenCOR
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Configure MSVC
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Install GCC 16
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-16 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-16 100
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"
      - name: Report the CPU
        shell: bash
        run: |
          if [ '${{ runner.os }}' == 'Linux' ]; then lscpu | grep 'Model name'; fi
          if [ '${{ runner.os }}' == 'macOS' ]; then sysctl -n machdep.cpu.brand_string; fi
          if [ '${{ runner.os }}' == 'Windows' ]; then powershell -Command "(Get-CimInstance Win32_Processor).Name"; fi
      - name: Build the x86-64-v3 version
        shell: bash
        run: |
          cmake -G Ninja -S . -B build-x86-64-v3 -DBUILD_TYPE=Release -DCOMPILER_CACHING=OFF -DDOCUMENTATION=OFF -DJAVASCRIPT_BINDINGS=OFF -DPREBUILT_SUNDIALS=OFF -DPYTHON_BINDINGS=OFF -DSHARED_LIBS=OFF -DUNIT_TESTING=ON
          cmake --build build-x86-64-v3 --target benchmark_executable
      - name: Build the x86-64 version
        shell: bash
        run: |
          sed -i.bak -E 's/set\(X86_64_V3_COMPILER_FLAGS "[^"]*"\)/set(X86_64_V3_COMPILER_FLAGS "")/' src/CMakeLists.txt
          grep -n 'set(X86_64_V3_COMPILER_FLAGS' src/CMakeLists.txt
          cmake -G Ninja -S . -B build-x86-64 -DBUILD_TYPE=Release -DCOMPILER_CACHING=OFF -DDOCUMENTATION=OFF -DJAVASCRIPT_BINDINGS=OFF -DPREBUILT_SUNDIALS=OFF -DPYTHON_BINDINGS=OFF -DSHARED_LIBS=OFF -DUNIT_TESTING=ON
          cmake --build build-x86-64 --target benchmark_executable
      - name: Run the benchmarks
        shell: bash
        run: |
          for RUN in 1 2 3; do
            for VERSION in x86-64 x86-64-v3; do
              build-$VERSION/tests/benchmark_executable | tee benchmark-$VERSION-$RUN.txt
            done
          done
      - name: Compare the benchmarks
        shell: bash
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections
          import glob

          # Keep, for each benchmark and version, the best median time over our different runs.

          medians = collections.defaultdict(list)
          names = []

          for version in ('x86-64', 'x86-64-v3'):
              for file_name in sorted(glob.glob(f'benchmark-{version}-*.txt')):
                  for line in open(file_name).readlines()[2:]:
                      fields = [field.strip() for field in line.split('|')]

                      if len(fields) >= 5:
                          medians[(fields[0], version)].append(float(fields[4]))

                          if fields[0] not in names:
                              names.append(fields[0])

          print('## ${{ matrix.name }}\n')
          print('| Benchmark | x86-64 (ms) | x86-64-v3 (ms) | Difference |')
          print('|---|---:|---:|---:|')

          for name in names:
              x86_64 = min(medians[(name, 'x86-64')])
              x86_64_v3 = min(medians[(name, 'x86-64-v3')])

              print(f'| {name} | {x86_64:.1f} | {x86_64_v3:.1f} | {100.0 * (x86_64_v3 - x86_64) / x86_64:+.1f}% |')
          EOF
